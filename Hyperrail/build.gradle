apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def VERSION_CODE = 64
def VERSION_NAME = '1.5.0'

android {
    defaultConfig {
        applicationId "be.hyperrail.android"
        minSdkVersion 23
        targetSdkVersion 36
        compileSdk 36
        versionCode VERSION_CODE
        versionName VERSION_NAME
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        resourceConfigurations += ['en', 'nl', 'fr']
    }
    android.buildFeatures.buildConfig true
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        targetCompatibility 11
        sourceCompatibility 11
    }
    lint {
        abortOnError false
    }
    namespace 'be.hyperrail.android'
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'joda-time:joda-time:2.14.0'
    implementation 'com.squareup.picasso:picasso:2.71828'

    def lifecycle_version = "2.10.0"
    // Force the same lifecycle-viewmodel for kotlin and java.
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.0.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20251224'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    // org.json is included with Android, but Android.jar can not be used from unit tests
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.4.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'design'
        exclude group: 'com.android.support', module: 'recyclerview-v7'
    }

    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation project(path: ':OpenTransport')
    implementation project(path: ':OpenTransport_be')
}

